<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="8"/>

  <!-- Shield Base -->
  <path d="M256 80 L384 136 C384 264 256 360 256 360 C256 360 128 264 128 136 L256 80 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Clipboard / Inner Icon -->
  <path d="M220 230 L245 255 L300 195" 
        fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5S Badges / Dots -->
  <circle cx="210" cy="410" r="14" fill="#38BDF8"/>
  <circle cx="256" cy="410" r="14" fill="#10B981"/>
  <circle cx="302" cy="410" r="14" fill="#F59E0B"/>
</svg>
